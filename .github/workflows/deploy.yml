name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job below asks only for what it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads where the site is published
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      # GitHub Pages reports where the site is published. base_path is
      # "/<repo-name>" for a project page and empty for a custom domain, so
      # neither the base href nor the public address is written in the code.
      - id: pages
        uses: actions/configure-pages@v6
      # The build also runs tools/check-dist.mjs and fails if anything private
      # or incomplete would be published.
      - run: npm run build -- --base-href "$BASE_PATH/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # "false" since the launch: search engines may list the site.
          # "true" would keep the whole site out of them (noindex on every
          # page).
          SITE_NOINDEX: 'false'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/sara-grimaldi/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
