@let press = item();
<ng-template #body>
  <h3 class="publication t-title">
    <app-logo class="publication-mark" [name]="press.publication" size="row" />
    @if (link()) {
      <span class="t-arrow-out" aria-hidden="true">→</span>
      <span class="visually-hidden">{{ site()?.ui?.newWindow }}</span>
    }
  </h3>
  <p class="description t-body">
    <app-inline-text [text]="press.description" />
  </p>
  <!-- prettier-ignore -->
  <p class="meta t-label t-muted t-tabular"><app-dot-line [items]="meta()" />@if (otherLanguage(); as language) {<span class="visually-hidden"> – {{ language }}</span>}</p>
</ng-template>

@if (link(); as href) {
  <a class="row grid linked" [href]="href" target="_blank" rel="noopener noreferrer">
    <ng-container [ngTemplateOutlet]="body" />
  </a>
} @else {
  <div class="row grid">
    <ng-container [ngTemplateOutlet]="body" />
  </div>
}
