@if (site(); as site) {
  <dialog
    #dialog
    id="site-menu"
    class="menu surface-ink"
    [attr.aria-label]="site.ui.menu"
    (close)="onClose()"
  >
    <div class="container panel">
      <div class="bar">
        <a
          class="wordmark"
          [routerLink]="route.link('home')"
          [attr.aria-label]="site.name + ' – ' + site.ui.home"
          (click)="close()"
          >{{ site.name }}</a
        >
        <app-language-switcher />
        <button class="close t-nav" type="button" autofocus (click)="close()">
          {{ site.ui.close }}
        </button>
      </div>

      <nav [attr.aria-label]="site.ui.mainNavLabel">
        <ul class="links">
          @for (page of pages; track page) {
            <li>
              <a
                class="link t-display"
                [routerLink]="route.link(page)"
                routerLinkActive
                ariaCurrentWhenActive="page"
                (click)="close()"
                ><span class="link-text">{{ site.nav[page] }}</span></a
              >
            </li>
          }
        </ul>
      </nav>

      <p class="contact t-small">
        <a class="contact-link" [href]="'mailto:' + site.contact.email">{{ site.contact.email }}</a>
      </p>
    </div>
  </dialog>
}
