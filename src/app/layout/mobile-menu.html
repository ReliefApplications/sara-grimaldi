@if (site(); as site) {
  <dialog #dialog id="site-menu" class="menu" [attr.aria-label]="site.ui.menu" (close)="onClose()">
    <div class="container panel">
      <div class="bar">
        <a
          class="wordmark"
          [routerLink]="route.link('home')"
          [attr.aria-label]="site.name + ' – ' + site.ui.home"
          (click)="close()"
          >{{ site.name }}</a
        >
        <app-language-switcher />
        <button class="close t-label" type="button" autofocus (click)="close()">
          {{ site.ui.close }}
        </button>
      </div>

      <nav [attr.aria-label]="site.ui.mainNavLabel">
        <ul class="links">
          @for (page of pages; track page) {
            <li>
              <a
                class="link t-display-l"
                [routerLink]="route.link(page)"
                routerLinkActive
                ariaCurrentWhenActive="page"
                (click)="close()"
                >{{ site.nav[page] }}</a
              >
            </li>
          }
        </ul>
      </nav>

      <dl class="contact">
        <dt class="t-label t-muted">{{ site.ui.email }}</dt>
        <dd>
          <a class="contact-link" [href]="'mailto:' + site.contact.email">{{
            site.contact.email
          }}</a>
        </dd>
      </dl>
    </div>
  </dialog>
}
